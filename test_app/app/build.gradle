apply plugin: 'com.android.application'

android {
    compileSdk 35
    namespace 'io.teak.app.test'

    defaultConfig {
        applicationId "io.teak.app.test"
        minSdk 21
        targetSdk 35
        multiDexEnabled true
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [
                teakShortDomain:"teakangrybots.jckpt.me",
                teakAppId:"1136371193060244"
        ]
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true

        unitTests.all {
            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen {false}
                showStandardStreams = true
            }
        }
    }
}

dependencies {
    implementation project(path: ':teak')

    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.2.0'

    implementation 'com.google.firebase:firebase-messaging:21.1.0'

    implementation "com.android.billingclient:billing:3.0.0"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.14.2'

    // GooglePlayServicesMissing tests mock GooglePlayServicesUtil / ConnectionResult, which the
    // SDK pulls in as `implementation` (not exposed to the test compile classpath transitively).
    testImplementation 'com.google.android.gms:play-services-base:17.1.0'

    // TODO: Investigate using Robolectric
//    testImplementation "org.robolectric:robolectric:4.6.1"

    // This is for HTTP mocking/testing
    implementation("com.github.tomakehurst:wiremock:2.27.2") {
        exclude group: 'org.apache.httpcomponents', module: 'httpclient'
        exclude group: 'asm', module: 'asm'
        exclude group: 'org.json', module: 'json'
        exclude group: 'com.google.guava', module:'guava'
    }
    implementation 'com.google.guava:guava:27.1-android'
    implementation group: 'net.jodah', name: 'concurrentunit', version: '0.4.0'
    testImplementation group: 'org.apache.httpcomponents', name: 'httpclient', version: '4.5.6'
}

