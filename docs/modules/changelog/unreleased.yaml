bug:
  - Remote logging on app launch now follows the saved `log_remote` setting rather than `verbose_logging`
  - "A `Teak.LogListener` that logs from inside its callback during startup no longer risks a `ConcurrentModificationException`, and a throwing listener no longer interrupts the startup log replay. Callbacks may now be invoked concurrently from multiple threads."
  - "Log events emitted while the SDK is configuring no longer risk a `ConcurrentModificationException` or missing common fields."
  - "Google Play purchases are now tracked in apps built with R8 or ProGuard minification that renamed or stripped `ProductDetailsResponseListener.onProductDetailsResponse`, `QueryProductDetailsResult.getProductDetailsList`, or `BuildConfig.VERSION_NAME`."
  - "Google Play Billing setup failures, service disconnects, and purchases that can't be priced are now logged."
  - "Google Play purchases that are still pending payment are no longer sent to Teak."
  - "Google Play purchases that complete while the game isn't running, such as a pending payment that clears later, are now sent to Teak the next time the game opens. Only purchases from the last 7 days are sent."
  - "The first session after install, or after a cold launch from a notification or link, now identifies the user when `Teak.identifyUser` was called before the session started. Previously that session never sent the identify call."
  - "`Teak.logout()` called before the first session starts, such as in the game's `onCreate`, no longer crashes the app, and no longer leaves a user id from an earlier `Teak.identifyUser` to be identified by the first session."
  - "Animated notifications keep animating after the screen turns off."
  - "A session created at the moment the remote configuration arrived could stay unconfigured and never identify the user."
