apply plugin: 'com.android.application'

android {
    compileSdk 35

    defaultConfig {
        applicationId "io.teak.app.unity.dev"
        minSdkVersion 23
        targetSdk 35
        versionCode 1
        versionName "1.0"

        manifestPlaceholders = [
                teakShortDomain:"teak-dev.freechips.link",
                teakAppId:"613659812345256"
        ]
    }

    // The 'google' flavor is the existing demo, untouched. The 'amazon' flavor is the
    // Amazon sandbox-detection harness: its manifest re-enables automatic purchase tracking
    // and its source set adds the purchase trigger + Appstore SDK license-verify hook.
    flavorDimensions = ["store"]
    productFlavors {
        google {
            dimension "store"
        }
        amazon {
            dimension "store"

            // SKU to purchase; must exist in your Amazon listing / App Tester sdktester.json.
            // Override per build with -PamazonSku=your.sku.here.
            resValue "string", "amazon_sandbox_sku", (project.findProperty('amazonSku') ?: 'io.teak.app.sku.dollar')

            // Whether to call LicensingService.verifyLicense at launch so getAppstoreSDKMode
            // resolves. Set -PverifyLicenseAtLaunch=false to read the UNKNOWN pre-verify window.
            resValue "bool", "amazon_verify_license_at_launch", (project.findProperty('verifyLicenseAtLaunch') ?: 'true')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        aidl true

    }
    namespace 'io.teak.app.java.dev'
}

gradle.projectsEvaluated {
    if (android.defaultConfig.targetSdkVersion.apiLevel < android.compileSdkVersion.split(/\-/)[1] as Integer) {
        throw new GradleException('targetSdkVersion is less than compileSdkVersion')
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'

    implementation 'androidx.core:core:1.6+'
    implementation 'androidx.work:work-runtime:2.7+'

    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.firebase:firebase-messaging:24.0.0'
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation "com.android.billingclient:billing:8.3.0"

    implementation project(path: ':teak')

    // Amazon IAP jars are proprietary, so only the legacy v2 jar is committed. Select the SDK
    // to link against with -PamazonIap=v2|appstore3x|v2-drm (default v2). The jars are linked
    // into the 'amazon' flavor only — the 'google' demo never sees them. See amazon-libs/README.md.
    def amazonIapVariant = (project.findProperty('amazonIap') ?: 'v2')
    def amazonIapDirs = [
            'v2'        : ['amazon-libs/iap-v2'],
            'appstore3x': ['amazon-libs/appstore3x'],
            'v2-drm'    : ['amazon-libs/iap-v2', 'amazon-libs/drm-standalone'],
    ]
    if (!amazonIapDirs.containsKey(amazonIapVariant)) {
        throw new GradleException("Unknown -PamazonIap='${amazonIapVariant}'. Valid: ${amazonIapDirs.keySet().join(', ')}")
    }
    amazonIapDirs[amazonIapVariant].each { dir ->
        amazonImplementation fileTree(dir: dir, include: ['*.jar'])
    }
}

apply plugin: 'com.google.gms.google-services'
