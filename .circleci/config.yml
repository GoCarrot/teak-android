version: 2.1

orbs:
  teak: teak/sdk-utils@1
  buildomat: teak/buildomat@0.1
  aws-cli: circleci/aws-cli@5.4.0

jobs:
  build:
    docker:
      - image: cimg/android:2026.02.1
        environment:
          ANDROID_HOME=/opt/android/sdk
    steps:
      - checkout
      - run:
          name: Check for any usage of the org.json.* namespace
          command: ./org_json_check
      - restore_cache:
          key: v1-{{ checksum "build.gradle" }}-{{ checksum  "test_app/build.gradle" }}-{{ checksum "Gemfile.lock" }}
      - run:
          name: Install Sentry CLI
          command: curl -sL https://sentry.io/get-cli/ | bash
      - run:
          name: Fix 'sdk.dir' in 'local.properties'
          command: |
            echo 'sdk.dir=/opt/android/sdk' > local.properties
            echo 'sdk.dir=/opt/android/sdk' > test_app/local.properties
      - run:
          name: Download Dependencies
          command: ./gradlew androidDependencies
      - save_cache:
          paths:
            - ~/.gradle
          key: v1-{{ checksum "build.gradle" }}-{{ checksum  "test_app/build.gradle" }}-{{ checksum "Gemfile.lock" }}
      - run:
          name: Build Teak SDK
          command: ./gradlew assemble
      - run:
          name: Compute Checksum
          command: |
            sha512sum build/outputs/aar/teak-release.aar > teak-release.sha512
            sha256sum build/outputs/aar/teak-release.aar > teak-release.sha256
      - persist_to_workspace:
          root: .
          paths:
            - build/outputs/aar/teak-release.aar
            - teak-release.sha512
            - teak-release.sha256
      - sentry_persist_proguard
      - sentry_upload_proguard:
          sentry_cli_args: --no-upload
      - store_artifacts:
          path: build/outputs/mapping/release/mapping.txt
          destination: mapping.txt
      - run:
          name: Make sure we're not using Executors or Threads
          command: ./check_thread_use
      - run:
          name: Run Teak SDK Unit Tests
          command: (cd test_app; ./gradlew testDebugUnitTest --continue)
      - store_test_results:
          path: test_app/app/build/test-results/

  build_docs:
    resource_class: small
    docker:
      - image: cimg/base:current
    steps:
      - teak/build-antora-playbook:
          build_type: development

  changelog_check:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - run:
          name: Check changelog fragments
          command: |
            yarn install --frozen-lockfile
            yarn changelog check

  tag_build:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - teak/tag-promote

  deploy_versioned:
    docker:
      - image: cimg/base:current
        environment:
          ANDROID_HOME=/opt/android/sdk
    steps:
      - fetch_release_artifacts
      - sentry_upload_proguard
      - upload_sdk:
          prefix: android
          versioned: true

  deploy_latest:
    docker:
      - image: cimg/base:current
    steps:
      - fetch_release_artifacts
      - sentry_upload_proguard
      - upload_sdk:
          prefix: android
          versioned: false

  # Dry run of deploy_versioned: same steps, but the S3 prefix is a literal android/dev/
  # (expired by a bucket lifecycle rule after 7 days) and the ProGuard mapping is processed
  # but not uploaded to Sentry.
  deploy_dev:
    docker:
      - image: cimg/base:current
    steps:
      - fetch_release_artifacts
      - sentry_upload_proguard:
          sentry_cli_args: --no-upload
      - upload_sdk:
          prefix: android/dev
          versioned: true

  docs:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - run:
          name: Install Doxygen
          command: sudo apt-get update && sudo apt-get install -y doxygen
      - run:
          name: Build API docs
          command: yarn && yarn docs

workflows:
  nightly:
    triggers:
      - schedule:
          cron: "0 0 * * 2-6"
          filters:
            branches:
              only:
                - develop
    jobs:
      - build:
          context:
            - Sentry
      - docs

  un-tagged-build:
    jobs:
      - build_docs:
          context:
            - Antora
          filters:
            branches:
              only: develop
            tags:
              ignore: /.*/
      - build:
          context:
            - Sentry
          filters:
            tags:
              ignore: /.*/
      - changelog_check:
          filters:
            tags:
              ignore: /.*/
      - tag_build:
          requires:
            - build
            - changelog_check
          filters:
            tags:
              ignore: /.*/
      # Dry run of the release steps after build. Parallel to tag_build and not required by
      # it: a failure turns the workflow red but doesn't block promote-tag creation.
      - deploy_dev:
          context:
            - AWS-OIDC-Role
            - Sentry
          requires:
            - build
          filters:
            tags:
              ignore: /.*/
      - docs:
          filters:
            tags:
              ignore: /.*/

  tagged-build:
    jobs:
      - build:
          context:
            - Sentry
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /.*/
      - deploy_versioned:
          context:
            - AWS-OIDC-Role
            - Sentry
          requires:
            - build
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /.*/
      - hold:
          type: approval
          requires:
            - build
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /.*/
      - deploy_latest:
          context:
            - AWS-OIDC-Role
            - Sentry
          requires:
            - hold
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /.*/

commands:
  fetch_release_artifacts:
    description: "Fetch tags, the build workspace, Sentry CLI and AWS credentials for a deploy job"
    steps:
      - checkout
      - run: git fetch --tags
      - run:
          name: Install Sentry CLI
          command: curl -sL https://sentry.io/get-cli/ | bash
      - aws-cli/setup
      - attach_workspace:
          at: .
      - buildomat/aws-oidc-assume
  # Uploads the built SDK artifacts to s3://teak-build-artifacts/<prefix>/. The prefix is always
  # a literal at the call site, never a variable, so a dev run can't write a release key.
  upload_sdk:
    description: "Upload SDK artifacts to S3"
    parameters:
      prefix:
        type: string
      versioned:
        type: boolean
    steps:
      - run:
          name: Upload SDK to S3
          command: |
            if [ "<< parameters.versioned >>" = "true" ]; then
              NAME="teak-$(git describe --tags --always)"
            else
              NAME="teak"
            fi
            DEST="s3://teak-build-artifacts/<< parameters.prefix >>"
            aws s3 cp build/outputs/aar/teak-release.aar ${DEST}/${NAME}.aar --acl public-read
            aws s3 cp teak-release.sha512 ${DEST}/${NAME}.sha512 --acl public-read
            aws s3 cp teak-release.sha256 ${DEST}/${NAME}.sha256 --acl public-read
  #
  # Persist ProGuard mappings to workspace
  #
  sentry_persist_proguard:
    description: "Persist ProGuard Mappings to Workspace"
    parameters:
      proguard_mapping:
        type: string
        default: "build/outputs/mapping/release/mapping.txt"
      sentry_uuid:
        type: string
        default: "build/intermediates/assets/release/sentry-debug-meta.properties"
    steps:
      - persist_to_workspace:
          root: .
          paths:
            - << parameters.proguard_mapping >>
  #
  # Upload ProGuard mappings to Sentry
  #
  sentry_upload_proguard:
    description: "Upload ProGuard Mappings to Sentry"
    parameters:
      proguard_mapping:
        type: string
        default: "build/outputs/mapping/release/mapping.txt"
      sentry_cli_args:
        type: string
        default: ""
    steps:
      - run:
          name: Upload ProGuard Mappings to Sentry
          command: |
            sentry-cli --version
            sentry-cli upload-proguard -p "${CIRCLE_PROJECT_REPONAME}-sdk" --require-one << parameters.proguard_mapping >> << parameters.sentry_cli_args >>
